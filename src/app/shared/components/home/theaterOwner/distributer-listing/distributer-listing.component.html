<div class="p-[40px]">
    <div class="mb-[40px] flex justify-end">
        <label for="table-search" class="sr-only">Search</label>
        <div class="relative">
            <div class="absolute inset-y-0 rtl:inset-r-0 start-0 flex items-center ps-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                </svg>
            </div>
            <input (keyup)="search($event);" type="text" id="table-search-users" class="outline-none block py-2 ps-10 text-sm text-gray-900 border border-gray-300 rounded-lg w-80 bg-gray-50" placeholder="Search name">
        </div>
    </div>
    <div class="rounded-lg flex justify-center">
        <table class="shadow-lg font-roboto font-normal w-fit border-[rgba(238,238,238,0.5)] border-[2px] border-solid rounded-[8px]">
            <thead>
                <tr>
                    <th class="font-semibold text-[14px] font-roboto text-left pl-[24px] min-w-[405px] py-[11px]">
                        Distributor
                    </th>
                    <th class="font-semibold text-[14px] font-roboto text-left pl-[24px] min-w-[200px] py-[11px]">
                        Movies Distributed
                    </th>
                    <th class="font-semibold text-[14px] font-roboto text-left pl-[24px] min-w-[235px] py-[11px]">
                        Action
                    </th>
                </tr>
            </thead>
            <tbody>
                @if(!displayData.length) {
                    <tr class="bg-[rgba(238,238,238,0.25)]" >
                        <td colspan="4" class="font-normal text-[14px] font-roboto pl-[24px] py-[11px] text-center">
                            No Data available.
                        </td>
                    </tr>
                }

                @for(data of displayData; track $index) {
                    <tr [ngClass]="{'evenColor': $index % 2 === 0, 'oddColor': $index % 2 !== 0}" >
                        <td class="font-normal text-[14px] font-roboto text-left pl-[24px] py-[11px]">
                            {{ data.name }}
                        </td>
                        <td class="font-normal text-[14px] font-roboto text-left pl-[24px] py-[11px]">
                            {{ data.distributedMoviesList.length }}
                        </td>
                        <td class="font-normal text-[14px] font-roboto text-center px-[24px] py-[11px] ">
                            <div>
                                <button [routerLink]="['/theaterOwner/distributors', data._id]" class="py-1 px-3 rounded-[5.07px] text-black border-solid border-[1px] border-black hover:text-white hover:bg-black transition-all duration-[300ms]">
                                    <div class="flex justify-center">
                                        <div>
                                            <p class="font-bold leading-[24px]" >See Movies</p>
                                        </div>
                                    </div>
                                </button>
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
    <div class="flex items-center justify-between pt-[40px]">
        <div>
            <div class="flex flex-col items-center">
                <!-- Help text -->
                <span class="text-sm text-gray-700">
                    Showing <span class="font-semibold text-gray-900">1</span> to <span class="font-semibold text-gray-900">10</span> of <span class="font-semibold text-gray-900">100</span> Entries
                </span>
            </div>
        </div>
        <div>
            <nav aria-label="Page navigation example">
                <ul class="inline-flex -space-x-px text-sm">
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 ms-0 leading-tight text-black bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-black hover:text-white">Previous</a>
                  </li>
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 leading-tight text-black bg-white border border-gray-300 hover:bg-black hover:text-white">1</a>
                  </li>
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 leading-tight text-black bg-white border border-gray-300 hover:bg-black hover:text-white">2</a>
                  </li>
                  <li>
                    <a href="#" aria-current="page" class="flex items-center justify-center px-3 h-8 text-white border-gray-300 bg-black hover:bg-[rgba(0,0,0,0.75)] hover:text-white">3</a>
                  </li>
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 leading-tight text-black bg-white border border-gray-300 hover:bg-black hover:text-white">4</a>
                  </li>
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 leading-tight text-black bg-white border border-gray-300 hover:bg-black hover:text-white">5</a>
                  </li>
                  <li>
                    <a href="#" class="flex items-center justify-center px-3 h-8 leading-tight text-black bg-white border border-gray-300 rounded-e-lg hover:bg-black hover:text-white">Next</a>
                  </li>
                </ul>
              </nav>
        </div>
    </div>
</div>
