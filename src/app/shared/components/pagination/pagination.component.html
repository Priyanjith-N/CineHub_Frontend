@if(totalItems) {
    <div class="flex items-center justify-between pt-[40px]">
        <div>
            <div class="flex flex-col items-center">
                <!-- Help text -->
                <span class="text-sm text-gray-700">
                    Showing <span class="font-semibold text-gray-900">{{ ((currentPage - 1) * 10) + 1 }}</span> to <span class="font-semibold text-gray-900">{{ currentPage * pageSize }}</span> of <span class="font-semibold text-gray-900">{{ totalItems }}</span> Entries
                </span>
            </div>
        </div>
        <div>
            <nav aria-label="Page navigation example">
                <ul class="inline-flex -space-x-px text-sm">
                    <li class="select-none">
                      <a (click)="previousPage();" class="flex items-center justify-center px-3 h-8 ms-0 leading-tight cursor-pointer text-black bg-white border border-e-0 border-gray-300 rounded-s-lg hover:bg-black hover:text-white">Previous</a>
                    </li>
                    @for (pageNumber of getPageNumbers(); track $index) {
                        <li class="select-none">
                          <a class="flex items-center justify-center px-3 h-8 leading-tight cursor-pointer" [class.notActivePage]="pageNumber !== currentPage" [class.activePage]="pageNumber === currentPage">{{ pageNumber }}</a>
                        </li>
                    }
                  <li class="select-none">
                    <a (click)="nextPage();" class="flex items-center justify-center px-3 h-8 leading-tight cursor-pointer text-black bg-white border border-gray-300 rounded-e-lg hover:bg-black hover:text-white">Next</a>
                  </li>
                </ul>
              </nav>
        </div>
    </div>
}
